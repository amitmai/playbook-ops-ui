<body>
<!--
  THESIS: A playbook is a show being called, not a backlog. This surface owns the
  moment a CSM says what happened and the next cue comes up. It refuses the SaaS
  task app: no card grid, no sidebar of icons, no blue primary button.
  OWN-WORLD: A stage manager's promptbook. Bone stock (#F5F1E6), graphite ink,
  ONE highlighter yellow (#FFE24A) marking the live line, grease-pencil red for
  late. Ruled cue sheets, a margin column, struck-through called cues, numbered
  cues, page-edge tape flags. Archivo for the call sheet, Courier Prime for the
  script, because a script is typed in Courier.
  STORY: The CSM sees what they owe in running order, opens one, reads the
  playbook's own words, sees what each answer will cause, and calls it.
  FIRST VIEWPORT: A running-order sheet. Ruled group headers LATE / TODAY /
  THIS WEEK, each cue a row: cue number in a margin box, client name in the
  heaviest type on screen, phase beneath in pencil, lateness at the right. The
  primary action is the row itself.
  FORM: Stage manager's promptbook, ranked 2 of 7 derived worlds, chosen by the
  user. NO SEED KEY: concept-seed.mjs produced no output in this environment
  (five attempts, exit 0, empty stdout), so the direction went to the user as a
  choice rather than to my own top rank.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, and DESIGN.md
-->
  <div id="app">
    <aside id="rail" class="rail" aria-label="Running order"></aside>
    <main id="view" class="stage"></main>
  </div>
  <div id="flash" class="flash" role="status" aria-live="polite"></div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
