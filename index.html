<!--
  THESIS: A playbook is the thing that runs, not the thing someone has to
  remember. Four surfaces over one graph: the queue a CSM owes today, the
  engagement as time, the department as a tree, and the connection.
  OWN-WORLD: A tallit and an illuminated page. White cloth, techelet stripes,
  gold used once per screen on the thing that is live. Frank Ruhl Libre — a
  Hebrew serif drawn in 1908 and redrawn for Haaretz — carries the voice;
  Archivo carries the chrome; Courier Prime carries the record.
  STORY: The CSM opens the queue, sees the TASK first and the client second,
  opens one, reads the playbook's own advice, writes what happened, and says
  what the outcome was — or postpones it and says nothing yet.
  FIRST VIEWPORT: A queue of cards in urgency order, task name heaviest.
  DEMO: With no token the app runs on demo.js — five invented nonprofits — and
  says so in a banner on every screen.
-->
